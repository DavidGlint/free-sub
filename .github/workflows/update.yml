name: Update Free Sub

on:
  schedule:
    # 每小时执行一次 (UTC时间)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build sub
        run: |
          # 尝试导入 build 模块，防止某些环境报错
          python -c "import build" 2>/dev/null || true

          # 执行构建脚本，同时生成 clash.yaml 和 config.json
          python build.py

          echo "========== Clash YAML Preview =========="
          head -20 dist/clash.yaml
          echo "Lines: $(wc -l < dist/clash.yaml)"

          echo "========== Sing-box JSON Preview =========="
          # 验证 JSON 格式是否合法
          python -c "import json; json.load(open('dist/config.json'))" && echo "JSON Valid" || echo "JSON Invalid"
          echo "Size: $(wc -c < dist/config.json) bytes"

      - name: Force commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # 同时添加两个输出文件
          git add -A dist/
          git status

          # 如果没有变更则跳过提交
          git diff --cached --quiet && echo "No changes detected, skipping commit." && exit 0

          # 提交并推送
          git commit -m "chore(sub): auto update $(date -u '+%Y%m%d %H:%M') UTC"
          git push
